# Sitio estático (sin build): Netlify publica la raíz del repo tal cual.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# URL fácil para el panel: aguassica.netlify.app/admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Ícono de la pestaña y cabeceras básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
